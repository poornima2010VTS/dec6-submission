<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTA Promo Section</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .cta-section {
        text-align: center;
        padding: 5rem 2rem;
        background: linear-gradient(135deg, #4f46e5, #06b6d4); /* gradient background */
        color: white;
    }

    .cta-section h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    .cta-section p {
        font-size: 1.3rem;
        margin-bottom: 2rem;
    }

    .cta-btn {
        background-color: white;
        color: #2563eb;
        padding: 0.8em 2em;
        font-size: 1.1rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    .cta-btn:hover {
        background-color: #1d4ed8;
        color: white; /* color change on hover */
    }
</style>
</head>
<body>

<section class="cta-section">
    <h1>Join Us Today</h1>
    <p>Sign up now to unlock exclusive features & early access updates.</p>
    <button class="cta-btn">Get Started</button>
</section>

</body>
</html>
