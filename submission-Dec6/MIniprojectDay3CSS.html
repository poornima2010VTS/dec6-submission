<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Full Screen Landing Page</title>

<style>
    /* Reset */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    /* Full-screen section */
    .hero {
        height: 100vh; /* full screen */
        width: 100%;
        background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)),
                    url("https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1200") center/cover no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        padding: 20px;
    }

    .hero h1 {
        font-size: 3rem;
        margin-bottom: 10px;
    }

    .hero p {
        font-size: 1.2rem;
        margin-bottom: 20px;
    }

    .btn {
        padding: 12px 25px;
        background: #ff5722;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-size: 1.1rem;
        display: inline-block;
    }

    .btn:hover {
        background: #e64a19;
    }

    /* Responsive text */
    @media (max-width: 768px) {
        .hero h1 {
            font-size: 2.2rem;
        }
        .hero p {
            font-size: 1rem;
        }
    }
</style>

</head>
<body>

<section class="hero">
    <div>
        <h1>Welcome to Our Website</h1>
        <p>Your success journey starts here.</p>
        <a href="#" class="btn">Get Started</a>
    </div>
</section>

</body>
</html>
