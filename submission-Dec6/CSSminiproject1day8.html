<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexbox Card Layout</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  padding: 40px;
}

.card-container {
  display: flex;
  gap: 25px;
  justify-content: center;
}

.card {
  background: white;
  width: 250px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.card-content h3 {
  margin: 0;
}

.card-content p {
  font-size: 14px;
  color: #555;
}

.card-content button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  background: #4a90e2;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

.card-content button:hover {
  background: #0066cc;
}
</style>
</head>

<body>

<h1 style="text-align:center;">Card Layout Using Flexbox</h1>

<div class="card-container">

  <div class="card">
    <img src="Calm Beach.jpg" alt="image">
    <div class="card-content">
      <h3>Card One</h3>
      <p>This is a simple card layout example using Flexbox.</p>
      <button>Learn More</button>
    </div>
  </div>

  <div class="card">
    <img src="men anime.jpg" alt="image">
    <div class="card-content">
      <h3>Card Two</h3>
      <p>Cards are arranged in a row with spacing.</p>
      <button>Learn More</button>
    </div>
  </div>

  <div class="card">
    <img src="women anime.jpg" alt="image">
    <div class="card-content">
      <h3>Card Three</h3>
      <p>Each card has image, title, text and a button.</p>
      <button>Learn More</button>
    </div>
  </div>

</div>

</body>
</html>
