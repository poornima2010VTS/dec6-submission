<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blog</title>

<style>
    body{
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
    }

    /* Header Section */
    header{
        background: linear-gradient(to right,#ff9966,#ff5e62);
        color: white;
        padding: 40px;
        text-align: left;
    }
    header h1{
        margin: 0;
        font-size: 30px;
        font-weight: bold;
    }
    header p{
        margin-top: 5px;
        font-size: 14px;
        opacity: 0.9;
    }

    /* Blog Container */
    .container{
        width: 80%;
        margin: 20px auto;
    }

    /* Blog Post Card */
    .post{
        background: white;
        padding: 20px;
        border-radius: 6px;
        margin-bottom: 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .post h2{
        margin: 0;
        font-size: 18px;
    }
    .post p{
        margin-top: 10px;
        font-size: 14px;
        color: #333;
    }

    /* Footer */
    footer{
        background: #333;
        color: white;
        text-align: center;
        padding: 10px 0;
        margin-top: 30px;
        font-size: 13px;
    }
</style>
</head>

<body>

<header>
    <h1>My Blog</h1>
    <p>Sharing Thoughts & Ideas</p>
</header>

<div class="container">

    <div class="post">
        <h2>Blog Post 1</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Quisque sit amet sagittis urna.</p>
    </div>

    <div class="post">
        <h2>Blog Post 2</h2>
        <p>Sed accumsan elit at orci suscipit, a malesuada odio fermentum. Ut ultricies magna sed lorem malesuada.</p>
    </div>

</div>

<footer>
    © 2025 My Blog. All Rights Reserved.
</footer>

</body>
</html>
