<!DOCTYPE html>
<html>
<head>
<title>Feature Comparison Table</title>

<style>
    body {
        font-family: Arial;
        background: #f4f4f4;
        margin: 0;
        padding: 30px;
    }

    table {
        width: 80%;
        margin: 20px auto;
        border-collapse: collapse;
        background: white;
    }

    th, td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
    }

    th {
        background: #4CAF50;
        color: white;
    }

    .highlight {
        background: #ffe6e6;
    }
</style>

</head>
<body>

<h2 style="text-align:center;">Feature Comparison</h2>

<table>
    <tr>
        <th>Feature</th>
        <th>Product A</th>
        <th>Product B</th>
    </tr>

    <tr>
        <td>Speed</td>
        <td>Fast</td>
        <td class="highlight">Moderate</td>
    </tr>

    <tr>
        <td>Price</td>
        <td class="highlight">High</td>
        <td>Low</td>
    </tr>

    <tr>
        <td>Support</td>
        <td>24/7 Available</td>
        <td class="highlight">Limited</td>
    </tr>

</table>

</body>
</html>
