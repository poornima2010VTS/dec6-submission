<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Showcase</title>

<style>
    body{font-family: Arial, sans-serif; margin:0; background:#f7f7f7;}

    .features-container{
        display:flex;
        gap:1.5rem;
        justify-content:center;
        padding:3rem 2rem;
        flex-wrap:wrap;
    }

    .feature-box{
        background:#fff;
        width:250px;
        text-align:center;
        padding:2rem;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.1);
        transition:0.3s;
    }

    .feature-box:hover{
        transform:scale(1.05);
        box-shadow:0 0 18px rgba(0,0,0,0.2);
    }

    .feature-box img{
        width:60px;
        margin-bottom:1rem;
    }

    .feature-box h3{
        margin-bottom:0.5rem;
    }
</style>
</head>
<body>

<section class="features-container">
    <div class="feature-box">
        <img src="https://cdn-icons-png.flaticon.com/128/1828/1828961.png">
        <h3>Fast Delivery</h3>
        <p>Get products quickly with our optimized logistics.</p>
    </div>

    <div class="feature-box">
        <img src="https://cdn-icons-png.flaticon.com/128/190/190411.png">
        <h3>Secure Payment</h3>
        <p>Your transactions are safe and encrypted.</p>
    </div>

    <div class="feature-box">
        <img src="https://cdn-icons-png.flaticon.com/128/929/929610.png">
        <h3>24/7 Support</h3>
        <p>We’re here anytime you need help.</p>
    </div>
</section>
</body>
