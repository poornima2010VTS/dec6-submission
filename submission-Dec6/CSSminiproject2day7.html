<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Login Form</title>

<style>
    /* Background Gradient */
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(to bottom right, #4facfe, #00f2fe);
        font-family: Arial, sans-serif;
    }

    /* Login Card */
    .login-box {
        background: #fff;
        padding: 30px;
        border-radius: 12px;
        width: 350px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* Title */
    .login-box h2 {
        text-align: center;
        margin-bottom: 10px;
    }

    /* Input fields */
    .login-box input {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    /* Login button */
    .login-box button {
        padding: 12px;
        background-color: #4f8fee;
        border: none;
        color: #fff;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
    }

    .login-box button:hover {
        background-color: #3c78d8;
    }
</style>

</head>
<body>

    <div class="login-box">
        <h2>Login</h2>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button>Login</button>
    </div>

</body>
</html>
