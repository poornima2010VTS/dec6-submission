<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter Signup Banner</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
}

/* Newsletter Banner */
.banner{
    width:100%;
    padding:70px 20px;
    background:url('https://images.pexels.com/photos/414171/pexels-photo-414171.jpeg') center/cover no-repeat;
    position:relative;
}

/* Overlay */
.banner::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.5);
}

.banner-content{
    position:relative;
    text-align:center;
    color:white;
    max-width:650px;
    margin:auto;
}

.banner-content h1{
    font-size:32px;
    margin-bottom:15px;
    text-shadow:0 0 10px rgba(0,0,0,0.7);
}

/* Input + Button */
.banner-content input{
    width:60%;
    max-width:350px;
    padding:10px;
    border:none;
    border-radius:4px;
    outline:none;
    font-size:15px;
}

.banner-content button{
    padding:11px 22px;
    border:none;
    margin-left:8px;
    border-radius:4px;
    background:#ffcc00;
    font-size:15px;
    cursor:pointer;
    transition:.3s;
}

.banner-content button:hover{
    background:#f1b700;
}

</style>
</head>
<body>

<section class="banner">
    <div class="banner-content">
        <h1>Subscribe to our Newsletter</h1>
        <input type="email" placeholder="Enter your email">
        <button>Sign Up</button>
    </div>
</section>

</body>
</html>
