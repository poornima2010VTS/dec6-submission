<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>

    <style>
        /* Navigation Bar Styling */
        nav {
            background-color: #2c3e50;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Logo */
        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        /* Menu */
        .menu {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        .menu li a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        /* Hover effect */
        .menu li a:hover {
            color: #1abc9c;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">MyWebsite</div>

        <ul class="menu">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

</body>
</html>
