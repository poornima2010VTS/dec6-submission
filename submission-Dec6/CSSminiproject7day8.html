<!DOCTYPE html>
<html>
<head>
<style>
body {
    font-family: Arial;
    background: #f9f9f9;
}

.contact-container {
    display: flex;
    gap: 30px;
    padding: 40px;
    max-width: 1000px;
    margin: auto;
    background: white;
    border-radius: 10px;
}

form {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input, textarea {
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.info {
    flex: 1;
    font-size: 18px;
}

@media(max-width: 768px) {
    .contact-container {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="contact-container">
    <form>
        <h2>Contact Us</h2>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Email">
        <textarea rows="5" placeholder="Your Message"></textarea>
        <button>Send Message</button>
    </form>

    <div class="info">
        <h2>Our Info</h2>
        <p><b>Phone:</b> +91 98765 43210</p>
        <p><b>Email:</b> support@vetritech.com</p>
        <p><b>Address:</b> Chennai, Tamil Nadu</p>
    </div>
</div>

</body>
</html>
