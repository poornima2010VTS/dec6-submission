<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datatype to String Conversion</title>
</head>
<body>

<h2>JavaScript – Convert Datatype to String</h2>

<p id="output"></p>

<script>
    let result = "";

    // 1. Using String()
    let num1 = 100;
    result += "String(100): " + String(num1) + "<br>";

    // 2. Using toString()
    let num2 = 50;
    result += "50.toString(): " + num2.toString() + "<br>";

    // 3. Using Template Literals
    let num3 = 123;
    result += "`${123}` : " + `${num3}` + "<br>";

    // 4. Using concatenation
    let num4 = 45;
    result += "45 + '' : " + (num4 + "") + "<br>";

    // 5. Using JSON.stringify()
    let obj = { name: "John", age: 25 };
    result += "JSON.stringify({name:'John',age:25}): " + JSON.stringify(obj) + "<br>";

    document.getElementById("output").innerHTML = result;
</script>

</body>
</html>
