<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Gallery</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
    }

    h2 {
        text-align: center;
        margin-top: 20px;
    }

    /* GALLERY CONTAINER */
    .gallery {
        display: flex;
        flex-wrap: wrap;          /* Allows images to move to next row */
        justify-content: center;  /* Centers all images */
        gap: 15px;                /* Space between images */
        padding: 20px;
    }

    /* IMAGE STYLING */
    .gallery img {
        width: 250px;
        height: 160px;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: transform 0.3s;
    }

    .gallery img:hover {
        transform: scale(1.05);
    }
</style>

</head>
<body>

<h2>Flexbox Image Gallery</h2>

<div class="gallery">
    <img src="men anime.jpg" alt="Image 1">
    <img src="women anime.jpg" alt="Image 2">
    <img src="Calm Beach.jpg" alt="Image 3">
    <img src="birthday.jpg" alt="Image 4">
    <img src="beachsunset.jpg" alt="Image 5">
    <img src="men anime.jpg" alt="Image 6">
</div>

</body>
</html>
