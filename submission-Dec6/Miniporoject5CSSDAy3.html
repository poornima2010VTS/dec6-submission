<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Contact Section</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
    }

    /* Full section height using vh */
    .contact-section {
        height: 80vh;
        padding: 20px;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .contact-container {
        width: 80%;
        max-width: 700px;
        background: #ffffff;
        padding: 20px;
        border-radius: 6px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .contact-container h1 {
        text-align: center;
        margin-bottom: 15px;
    }

    /* Form instructions using em */
    .instructions {
        font-size: 1.1em;
        text-align: center;
        margin-bottom: 20px;
        color: #555;
    }

    label {
        font-size: 1.1rem; /* label text using rem */
        display: block;
        margin-bottom: 5px;
    }

    input, textarea {
        width: 100%; /* % width requirement */
        padding: 10px;
        margin-bottom: 15px; /* spacing between fields using px */
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
    }

    .contact-info {
        margin-top: 20px;
        font-size: 1rem;
        text-align: center;
        color: #333;
    }
</style>
</head>

<body>

<section class="contact-section">
    <div class="contact-container">

        <h1>Contact Us</h1>

        <p class="instructions">Please fill out the form below and we will get back to you soon.</p>

        <form>
            <label>Name:</label>
            <input type="text" placeholder="Enter your name">

            <label>Email:</label>
            <input type="email" placeholder="Enter your email">

            <label>Message:</label>
            <textarea rows="4" placeholder="Write your message here"></textarea>
        </form>

        <div class="contact-info">
            Email: info@example.com &nbsp; | &nbsp; Phone: +91 98765 43210
        </div>

    </div>
</section>

</body>
</html>
