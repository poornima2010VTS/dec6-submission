<!DOCTYPE html>
<html>
<head>
<title>Testimonial Section</title>
<style>
    body {
        font-family: Arial;
        background: #f5f5f5;
        margin: 0;
    }

    .container {
        width: 80%;
        margin: 30px auto;
    }

    .title {
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .testimonials {
        display: flex;
        gap: 20px;
    }

    .card {
        background: #fff;
        box-sizing: border-box;
        width: 33%;
        padding: 20px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    .card p {
        color: #444;
    }

    .name {
        font-weight: bold;
        margin-top: 15px;
        color: #333;
    }
</style>
</head>
<body>

<div class="container">
    <div class="title">Testimonials</div>

    <div class="testimonials">
        <div class="card">
            <p>"Great service! Highly recommended."</p>
            <div class="name">– John Doe</div>
        </div>

        <div class="card">
            <p>"Very professional team and fast delivery."</p>
            <div class="name">– Priya Sharma</div>
        </div>

        <div class="card">
            <p>"Amazing experience and quality work."</p>
            <div class="name">– Michael Lee</div>
        </div>
    </div>
</div>

</body>
</html>
