<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    font-family: Arial;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #1e88e5;
    padding: 15px 40px;
    color: white;
}

nav .links {
    display: flex;
    gap: 25px;
}

nav a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

button {
    padding: 8px 20px;
    border: none;
    border-radius: 5px;
    background: #fff;
    color: #1e88e5;
    font-weight: bold;
}
</style>
</head>
<body>

<nav>
    <div class="logo">MyLogo</div>

    <div class="links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <button>Login</button>
</nav>

</body>
</html>
