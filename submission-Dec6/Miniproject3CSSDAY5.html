<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page Hero Section</title>

<style>
    body{
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
    }

    .hero{
        height: 100vh;
        width: 100%;
      /*  background-image: url("https://img.freepik.com/free-vector/abstract-gradient-liquid-background_23-2148905757.jpg"); */
        background-size: cover;
        background-position: center;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
    }

    .hero h1{
        font-size: 3rem;
        color: white;
        text-shadow: 2px 2px 6px black;
        margin-bottom: 10px;
    }

    .hero p{
        font-size: 1.3rem;
        color: white;
        margin-bottom: 20px;
    }

    .hero button{
        background-color: #ff5722;
        color: white;
        border: none;
        padding: 12px 28px;
        font-size: 1rem;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transition: 0.3s;
    }

    .hero button:hover{
        background-color: #ff784e;
        transform: scale(1.08);
    }

    .logo{
        width: 180px;
        margin-top: 20px;
    }
</style>
</head>
<body>

<section class="hero">
    <h1>Welcome to Our Website</h1>
    <p>Your success journey starts here!</p>

    <button>Get Started</button>

    <!-- Logo like sample Output -->
    <img class="logo" src="VETRI TECHNOLOGY SOLUTIONS_35192022_logo.jpeg" alt="Vetri Logo">
</section>

</body>
</html>
