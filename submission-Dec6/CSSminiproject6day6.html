<!DOCTYPE html>
<html>
<head>
<title>Team Members</title>

<style>
    body {
        font-family: Arial;
        background: #f3f3f3;
        margin: 0;
    }

    .container {
        width: 80%;
        margin: 30px auto;
    }

    .title {
        text-align: center;
        font-size: 26px;
        margin-bottom: 20px;
        font-weight: bold;
    }

    .team-grid {
        display: flex;
        justify-content: space-between;
    }

    .member-card {
        width: 30%;
        background: #fff;
        padding: 20px;
        margin: 10px 0;
        text-align: center;
        border-radius: 8px;
        box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }

    .member-card img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-bottom: 10px;
    }

    .name {
        font-size: 18px;
        font-weight: bold;
    }

    .role {
        color: #555;
        margin-top: 5px;
    }
</style>

</head>
<body>

<div class="container">
    <div class="title">Our Team</div>

    <div class="team-grid">

        <div class="member-card">
            <img src="men anime.jpg" alt="Team Member 1">
            <div class="name">Ravi Kumar</div>
            <div class="role">Project Manager</div>
        </div>

        <div class="member-card">
            <img src="women anime.jpg" alt="Team Member 2">
            <div class="name">Anita Singh</div>
            <div class="role">UI/UX Designer</div>
        </div>

        <div class="member-card">
            <img src="men anime.jpg" alt="Team Member 3">
            <div class="name">Suresh Babu</div>
            <div class="role">Developer</div>
        </div>

    </div>
</div>

</body>
</html>
