        function cube(num) {

    // Function to check even or odd
    function checkEvenOdd(num) {

        if (num % 2 === 0) {
            document.write("TASK3: ") 
            document.write(num + " is Even<br>");
            console.log(num + " is Even");
        } else {

        }
    }

  function factorial(num) {
        let fact = 1;
        
        for (let i = 1; i <= num; i++) {
            fact = fact * i;
        }

        document.write("Factorial of " + num + " is: " + fact + "<br>");
        console.log("Factorial of " + num + " is: " + fact);

        return fact;
    }

    // Call the function
    factorial(5);  // Change the number if you want

     // TASK 17

     function capitalizeWords(sentence) {
    let result = sentence.split(" ").map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
    document.write("Capitalized: " + result + "<br>");
    console.log("Capitalized:", result);
    return result;
  }

}

       // TASK 19
function countVowelsConsonants(str) {
    let vowels = "aeiouAEIOU";
    let vCount = 0, cCount = 0;
    for (let char of str) {
        if (/[a-zA-Z]/.test(char)) {
            if (vowels.includes(char)) vCount++;
            else cCount++;
          }
       }
       document.write("Vowels: " + vCount + ", Consonants: " + cCount + "<br>");
       console.log("Vowels:", vCount, "Consonants:", cCount);
     }
       countVowelsConsonants("Hello World");

        // TASK 20
   function isPrime(num) {
    if (num < 2) return false;
    for (let i = 2; i <= Math.sqrt(num); i++) {
        if (num % i === 0) return false;
    }
    return true;
}

let n = 17;
document.write(n + " is prime? " + isPrime(n) + "<br>");
console.log(n + " is prime?", isPrime(n));
