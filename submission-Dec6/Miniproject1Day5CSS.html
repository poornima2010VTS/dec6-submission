<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smooth Scroll Navigation</title>

<style>
    /* Enable smooth scrolling */
    html {
        scroll-behavior: smooth;
        font-family: Arial, sans-serif;
    }

    /* Navigation bar styling */
    nav {
        background-color: #333;
        padding: 1rem;
        position: fixed;
        width: 100%;
        top: 0;
        left: 0;
        text-align: center;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 0 15px;
        font-size: 1.1rem;
        font-weight: bold;
    }

    nav a:hover {
        color: #00e5ff;
    }

    /* Section styling */
    section {
        height: 100vh; /* full screen height */
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        color: white;
        padding-top: 60px; /* space for fixed nav */
    }

    #home { background: #4f46e5; }
    #about { background: #06b6d4; }
    #services { background: #10b981; }
    #contact { background: #ef4444; }
</style>

</head>
<body>

<!-- Navigation Menu -->
<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
</nav>

<!-- Page Sections -->
<section id="home">🏠 Home Section</section>
<section id="about">📌 About Us</section>
<section id="services">⚙ Services</section>
<section id="contact">📞 Contact Us</section>

</body>
</html>
