<!DOCTYPE html>
<html>
<head>
    <title>Simple Card Layout</title>
    <style>
        .card {
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
            font-family: Arial, sans-serif;
            margin: 20px auto;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .card-text {
            color: #555;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 15px;
            background-color: #007bff;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://picsum.photos/300/200" alt="Sample Image">

        <div class="card-body">
            <div class="card-title">Beautiful Nature</div>
            <div class="card-text">
                This is a simple card layout created using HTML and CSS.
            </div>
          <!-- <button class="btn">Learn More</button> -->
        </div>
    </div>

</body>
</html>
