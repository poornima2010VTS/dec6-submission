<!DOCTYPE html>
<html>
<head>
<title>About Us</title>

<style>
    body {
        margin: 0;
        font-family: Arial;
    }

    .header {
        background: linear-gradient(90deg, #4CAF50, #2E7D32);
        padding: 25px;
        text-align: center;
        color: white;
        font-size: 28px;
        font-weight: bold;
    }

    .container {
        width: 80%;
        margin: 30px auto;
    }

    .about-section {
        display: flex;
        gap: 30px;
        padding: 20px;
        border-top: 2px solid #ccc;
        border-bottom: 2px solid #ccc;
    }

    .text {
        width: 60%;
        font-size: 18px;
        color: #444;
        line-height: 1.5;
    }

    .image-box {
        width: 40%;
    }

    .image-box img {
        width: 100%;
        border-radius: 10px;
    }
</style>

</head>
<body>

<div class="header">About Us</div>

<div class="container">

    <div class="about-section">
        
        <div class="text">
            <h2>Who We Are</h2>
            <p>We are a leading technology solutions company delivering high quality IT training with guaranteed placement assistance.</p>

            <h3>Our Mission</h3>
            <p>To empower students with the right knowledge, tools, and skills to succeed in the IT industry.</p>
        </div>

        <div class="image-box">
            <img src="vetri image.jpg" alt="Company Image">
        </div>

    </div>

</div>

</body>
</html>
