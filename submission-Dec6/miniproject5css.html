<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Project 5 - Testimonial Section</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    body{
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background: #f5f5f5;
    }

    section{
        padding: 40px 20px;
        text-align: center;
    }

    h1{
        font-size: 2rem;
        margin-bottom: 20px;
        font-family: "Poppins", sans-serif;
    }

    .testimonials{
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    article{
        background: white;
        padding: 20px;
        width: 300px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        text-align: left;
    }

    .user-name{
        font-family: "Poppins", sans-serif;
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .quote{
        font-style: italic;
        margin-bottom: 10px;
        color: #555;
    }

    .rating{
        color: #ffb400;
        font-size: 1.2rem;
    }

    /* Responsive */
    @media (max-width: 600px){
        article{
            width: 100%;
        }
    }
</style>

</head>
<body>

<section>

    <h1>User Testimonials</h1>

    <div class="testimonials">

        <article>
            <p class="user-name">Sarah Johnson</p>
            <p class="quote">"Amazing service! The team delivered exactly what I needed."</p>
            <p class="rating">★★★★★</p>
        </article>

        <article>
            <p class="user-name">Michael Lee</p>
            <p class="quote">"Very professional and great communication throughout."</p>
            <p class="rating">★★★★★</p>
        </article>

        <article>
            <p class="user-name">Amit Sharma</p>
            <p class="quote">"Highly recommended! Beautiful design and fast delivery."</p>
            <p class="rating">★★★★☆</p>
        </article>

    </div>

</section>

</body>
</html>
