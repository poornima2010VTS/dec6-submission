<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Landing Page</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .header {
            background-color: #ff5e27;
            padding: 40px;
            text-align: center;
            color: white;
        }

        /* Feature Section */
        .feature {
            margin: 20px;
            padding: 40px;
            border: 1px solid #ddd;
            background-color: #ffffff;
            text-align: center;
        }

        .feature img {
            width: 90px;
            margin-bottom: 15px;
        }

        /* Footer */
        .footer {
            background-color: black;
            padding: 20px;
            text-align: center;
            color: white;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h1>Welcome to Our Landing Page</h1>
        <p>Discover amazing features and services</p>
    </div>

    <!-- Feature Section -->
    <div class="feature">
        <img src="https://vetritechnologysolutions.com/images/vetri.png" alt="Logo">
        <h2>Why Choose Us?</h2>
        <p>We provide high-quality services to help you grow your business.</p>
    </div>

    <!-- Footer Section -->
    <div class="footer">
        © 2025 Vetri Technology Solutions. All rights reserved.
    </div>

</body>
</html>
