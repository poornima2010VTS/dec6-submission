<!DOCTYPE html>
<html>
<head>
<style>
.news-banner {
    background: linear-gradient(135deg, #6a11cb, #2575fc);
    padding: 30px;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 900px;
    margin: 40px auto;
    border-radius: 10px;
}

.news-banner input {
    padding: 10px;
    width: 250px;
    border: none;
    border-radius: 5px;
}

.news-banner button {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    background: orange;
    color: black;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="news-banner">
    <h2>Subscribe to our Newsletter</h2>

    <div>
        <input type="email" placeholder="Enter your email">
        <button>Subscribe</button>
    </div>
</div>

</body>
</html>
